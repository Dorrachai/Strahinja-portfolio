<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strahinja Velickovic — Redirecting...</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <script>
      // Single Page Application routing fallback for GitHub Pages
      // Converts direct path URLs into HashRouter-compatible URLs.
      (function () {
        try {
          var l = window.location;
          var pathname = l.pathname;
          var knownRoutes = ["work", "about", "contact"];
          var knownSlugs = ["strahinja-portfolio", "strahinja-velickovic"];
          var segments = pathname.split("/").filter(Boolean);
          var basePath = "";
          var routePath = "";

          // Determine if first path segment is a GitHub Pages repository subpath
          var isRepoSubpath = false;
          if (segments.length > 0) {
            var firstSeg = segments[0].toLowerCase();
            if (knownSlugs.indexOf(firstSeg) !== -1) {
              isRepoSubpath = true;
            } else if (l.hostname.endsWith(".github.io") && knownRoutes.indexOf(firstSeg) === -1) {
              isRepoSubpath = true;
            }
          }

          if (isRepoSubpath) {
            basePath = "/" + segments[0];
            routePath = segments.slice(1).join("/");
          } else {
            basePath = "";
            routePath = segments.join("/");
          }

          var redirectUrl =
            l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            basePath +
            "/#/" +
            routePath +
            (l.search ? l.search : "") +
            (l.hash || "");

          l.replace(redirectUrl);
        } catch (e) {
          // Graceful fallback to relative root
          window.location.replace("./");
        }
      })();
    </script>
    <meta http-equiv="refresh" content="2; url=./" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0b0b0d;
        color: #f4f4f5;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
      }
      .container {
        max-width: 480px;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        margin: 0 0 1rem 0;
        letter-spacing: -0.025em;
      }
      p {
        color: #a1a1aa;
        line-height: 1.5;
        margin: 0 0 1.5rem 0;
        font-size: 1rem;
      }
      a {
        color: #ffffff;
        background-color: #27272a;
        padding: 0.6rem 1.25rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        display: inline-block;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #3f3f46;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Redirecting...</h1>
      <p>Taking you to Strahinja Velickovic's game audio portfolio.</p>
      <a href="./">Return to Home</a>
    </div>
  </body>
</html>
